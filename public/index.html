<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />    
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /> 
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Controle financeiro pessoal com dashboards e relatórios" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanças" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@500;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Finanças</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('financas_theme');
          if (t) t = JSON.parse(t);
          var isDark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          var html = document.documentElement;
          html.classList.add('theme-loading');
          if (isDark) html.classList.add('dark');
          html.style.colorScheme = isDark ? 'dark' : 'light';
          document.addEventListener('DOMContentLoaded', function() {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isDark ? '#0a0f1e' : '#6366f1');
          });
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para usar este app.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
